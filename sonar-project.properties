sonar.projectName=Crafleet
sonar.sources=packages/core/src,packages/adapters/src,packages/cli/src,scripts
sonar.tests=packages,tests
sonar.inclusions=**/*.ts,**/*.js,**/*.mjs
sonar.exclusions=**/*.test.ts,**/*.bench.ts,**/*.d.ts
sonar.test.inclusions=**/*.test.ts
sonar.coverage.exclusions=scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.sourceEncoding=UTF-8
